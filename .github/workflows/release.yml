name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate release tag
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  package:
    name: Build and verify VSIX
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Audit all dependencies
        run: pnpm run audit:all

      - name: Static checks
        run: pnpm run check

      - name: Integration tests
        run: pnpm run test:integration

      - name: Package smoke
        run: pnpm run test:package

      - name: Asciidoctor compatibility
        run: pnpm run check:asciidoctor-compat

      - name: Performance gates
        run: |
          pnpm run perf:large-table
          pnpm run perf:preview-block-cells
          pnpm run perf:codelens

      - name: Deterministic UI review
        run: pnpm run review:ui:deterministic

      - name: Build release VSIX
        run: pnpm run package:vsix

      - name: Verify release asset
        shell: bash
        run: |
          asset="asciidoc-table-editor-${{ needs.prepare.outputs.version }}.vsix"
          test -f "$asset"
          shasum -a 256 "$asset" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          node scripts/create-release-notes.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --checksums SHA256SUMS.txt \
            --out release-notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: asciidoc-table-editor-${{ needs.prepare.outputs.version }}
          path: |
            asciidoc-table-editor-${{ needs.prepare.outputs.version }}.vsix
            SHA256SUMS.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  host-smoke:
    name: VS Code ${{ matrix.target }} Host smoke
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - minimum
          - current
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Extension Host smoke
        run: pnpm run test:integration:host -- --target ${{ matrix.target }}

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - package
      - host-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: asciidoc-table-editor-${{ needs.prepare.outputs.version }}
          path: release

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "AsciiDoc Table Editor $TAG" \
            --notes-file release/release-notes.md \
            "release/asciidoc-table-editor-${{ needs.prepare.outputs.version }}.vsix" \
            release/SHA256SUMS.txt
